name: Pages

# The public face of the project:
#   /            the presentation, which is also the landing page
#   /web/        the playable browser edition, exactly what is in the repo
#
# Both are built from a clean checkout on every push to main, so the site can
# never drift from the code.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the browser edition
        run: |
          python -m pip install --upgrade pip
          python -m pip install chess
          python tools/build_web.py
          python tools/make_deck.py

      - name: Assemble the site
        run: |
          mkdir -p _site/web
          cp presentation/index.html _site/index.html
          cp -r web/. _site/web/
          # In the repo the deck sits in presentation/, so it links up and out
          # to ../web/. At the site root the app is simply ./web/. (The page
          # also probes at runtime; this makes the link right without it.)
          sed -i 's|href="../web/index.html"|href="web/index.html"|' _site/index.html
          grep -o 'id="play-link" href="[^"]*"' _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
