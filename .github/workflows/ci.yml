name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: self test - ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libgl1 libegl1 libglib2.0-0

      - name: Self test (headless)
        run: python tools/selftest.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Application smoke (headless)
        run: python tools/app_smoke.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Engine benchmark (smoke)
        run: python tools/bench.py --count 20 --ms 150

  package:
    name: PyInstaller smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libgl1 libegl1 libglib2.0-0

      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller packaging/talos.spec --noconfirm --distpath dist

      - name: The bundle must contain the app and its database
        run: |
          test -x dist/talos/talos
          # PyInstaller 6 keeps the payload beside the binary, under _internal/
          db=$(find dist/talos -name lucas.db | head -1)
          test -n "$db"
          echo "database: $db ($(du -h "$db" | cut -f1))"
          du -sh dist/talos

      - name: Frozen app starts and provisions player data
        shell: bash
        run: |
          player_data=$(mktemp -d)
          set +e
          QT_QPA_PLATFORM=offscreen TALOS_DATA_DIR="$player_data" \
            timeout --signal=TERM 8s dist/talos/talos > frozen-app.log 2>&1
          result=$?
          set -e
          # The event loop should still be alive when timeout ends it. A real
          # startup exception exits with another status and prints the log.
          if [ "$result" -ne 124 ]; then
            cat frozen-app.log
            echo "Frozen TALOS exited unexpectedly ($result)" >&2
            exit 1
          fi
          test -s "$player_data/lucas.db"
          test -s "$player_data/settings.json"

  web:
    name: Browser edition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the web bundle
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python tools/build_web.py
          python tools/make_deck.py

      - name: The presentation must exist and have no placeholders left
        run: |
          test -s presentation/index.html
          ! grep -q "__[A-Z]*__" presentation/index.html

      - name: The Python core must import under Pyodide
        run: |
          npm install --no-save --no-package-lock pyodide@0.27.7 jsdom
          node tools/web_smoke.mjs

      - name: The page must boot and play
        run: node tools/web_dom_check.mjs

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # The action defaults to the retired SDK `tools` package. Request the
      # current platform tools explicitly so hosted runners can reach Gradle.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install the Android 35 build platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and inspect the native APK
        run: |
          python -m pip install --upgrade pip
          python -m pip install chess
          npm ci
          npm run android:debug
          (cd android && ./gradlew --no-daemon :app:testDebugUnitTest)
          test -s release/talos-android-*-debug.apk
          unzip -t release/talos-android-*-debug.apk >/dev/null
